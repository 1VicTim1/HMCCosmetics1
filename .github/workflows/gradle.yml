name: Java CI and Release with Gradle

on:
  push:
    # Обычная сборка для коммитов в основную ветку
    branches: [ "main" ]
    # Автоматический релиз при появлении нового тега (v1.0.0, v2.1.3 и т.д.)
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Задача сборки и тестирования
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Кэширование зависимостей Gradle для ускорения последующих сборок
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4.0.0
      with:
        gradle-version: '8.9'

    # Основной шаг сборки. Убедитесь, что в вашем build.gradle есть задача 'build'
    - name: Build with Gradle
      run: gradle build

    # Сохраняем собранные JAR-файлы как артефакт, чтобы передать в следующую задачу
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: arena-plugin-jars
        path: build/libs/*.jar
        retention-days: 1 # Можно увеличить, если нужно хранить дольше

  # Задача создания релиза (запускается ТОЛЬКО при пуше тега v*)
  create-release:
    # Условие: запускать эту задачу, только если сборка успешна и пуш был тегом
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Это разрешение необходимо для создания релиза

    steps:
    - name: Download built artifacts
      uses: actions/download-artifact@v4
      with:
        name: arena-plugin-jars
        path: ./release-jars

    # Этот экшен создаст полноценный релиз на GitHub с вашими JAR файлами
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        # Используем имя тега (например, v1.0.0) как имя релига
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        # Автоматически создаст список изменений из коммитов
        generate_release_notes: true
        # Прикрепит все скачанные JAR файлы к релизу
        files: |
          ./release-jars/*.jar
